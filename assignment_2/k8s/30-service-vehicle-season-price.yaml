apiVersion: v1
kind: Service
metadata:
  name: service-vehicle-season-price
  namespace: vehicle-rental
  labels:
    app: service-vehicle-season-price
spec:
  selector:
    app: service-vehicle-season-price
  ports:
    - port: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-vehicle-season-price
  namespace: vehicle-rental
spec:
  replicas: 3
  selector:
    matchLabels:
      app: service-vehicle-season-price
  template:
    metadata:
      labels:
        app: service-vehicle-season-price
    spec:
      containers:
        - name: service-vehicle-season-price
          image: vehicle-rental/service-vehicle-season-price:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: INSTANCE_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Runtime reads go to the replica-fronting Service; Flyway migrations always target
            # the primary directly (see application.yml's separate spring.flyway.* connection).
            - name: DB_HOST
              value: postgres-replica
            - name: FLYWAY_DB_HOST
              value: postgres-primary
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: ETCD_ENABLED
              value: "true"
            - name: ETCD_ENDPOINTS
              value: "http://etcd-0.etcd:2379,http://etcd-1.etcd:2379,http://etcd-2.etcd:2379"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
