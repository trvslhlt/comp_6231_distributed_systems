apiVersion: v1
kind: Service
metadata:
  name: service-vehicle-total-price
  namespace: vehicle-rental
  labels:
    app: service-vehicle-total-price
spec:
  selector:
    app: service-vehicle-total-price
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-vehicle-total-price
  namespace: vehicle-rental
spec:
  replicas: 3
  selector:
    matchLabels:
      app: service-vehicle-total-price
  template:
    metadata:
      labels:
        app: service-vehicle-total-price
    spec:
      containers:
        - name: service-vehicle-total-price
          image: vehicle-rental/service-vehicle-total-price:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: INSTANCE_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: ETCD_ENABLED
              value: "true"
            - name: ETCD_ENDPOINTS
              value: "http://etcd-0.etcd:2379,http://etcd-1.etcd:2379,http://etcd-2.etcd:2379"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
